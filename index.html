<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060a1c">
<title>アストラル・クロニクル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=DotGothic16&family=M+PLUS+1p:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="wrap">
 <div id="top">
  <div class="nrg"><b id="tCh">第1章</b><small id="tPr"></small><div class="mini"><i id="tPrB"></i></div></div>
  <div class="cur"><span id="tGil">0</span><small>G</small></div>
 </div>
 <div id="stage">
  <canvas id="cv"></canvas>
  <canvas id="dcv"></canvas>
  <canvas id="tcv"></canvas>
  <canvas id="dov"></canvas><div id="ttl"><img class="bg" src="img/title_bg.webp" alt=""><i class="spk" style="left:12%;top:62%;animation-delay:0s"></i><i class="spk" style="left:28%;top:70%;animation-delay:1.1s"></i><i class="spk" style="left:46%;top:58%;animation-delay:2.2s"></i><i class="spk" style="left:63%;top:66%;animation-delay:0.6s"></i><i class="spk" style="left:80%;top:60%;animation-delay:1.7s"></i><i class="spk" style="left:90%;top:72%;animation-delay:2.6s"></i><i class="spk" style="left:20%;top:52%;animation-delay:0.3s"></i><i class="spk" style="left:72%;top:50%;animation-delay:1.4s"></i><div class="logo"><h1 class="en"><span class="a1">ASTRAL</span><span class="a2">CHRONICLE</span></h1></div><div class="tap">TAP TO START</div><div class="cp">© ASTRAL CHRONICLE</div></div>
  <div id="home" class="page tp">
   <div class="news"><span>解き放たれたソロモン七十二柱を、指輪のかけらで封じる旅。　ステージをクリアすると仲間が増えていきます。　弱点属性を突いて、すばやく続けてタップでチェイン！</span></div>
   <div class="side">
    <button class="sbtn" id="hParty"><svg viewBox="0 0 24 24"><path d="M8 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm8 0a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM1 20c0-4 3-7 7-7s7 3 7 7zm15 0c0-2-.6-3.9-1.7-5.3A6 6 0 0 1 23 20z"/></svg>編成</button>
    <button class="sbtn" id="hSound"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zm13 3a4 4 0 0 0-2-3.5v7a4 4 0 0 0 2-3.5zm-2-8v2a7 7 0 0 1 0 12v2a9 9 0 0 0 0-16z"/></svg><span id="sndL">音 ON</span></button>
   </div>
   <div class="dock">
    <button class="bigbtn" id="hQuest">クエスト<small id="hNext">つぎのステージ</small></button>
   </div>
  </div>
  <div id="quest" class="page"></div>
  <div id="units" class="page"></div>
  <div id="shop" class="page"></div>
  <div id="dhud" style="visibility:hidden"></div>
  <div id="joy"><i></i></div>
  <div id="bhud"><div id="bwave">BATTLE 1/3</div><div class="bb"><button id="bAuto">AUTO</button><button id="bSpd">×1</button><button id="bMenu" aria-label="メニュー">≡</button></div></div>
  <div id="fade"></div>
 </div>
 <div id="nav">
  <button data-p="home" class="on"><svg viewBox="0 0 24 24"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>ホーム</button>
  <button data-p="quest"><svg viewBox="0 0 24 24"><path d="M14.5 3H21v6.5l-9.8 9.8 1.4 1.4-1.4 1.4-2.5-2.5-3 3-1.4-1.4 3-3-2.5-2.5 1.4-1.4 1.4 1.4z"/></svg>クエスト</button>
  <button data-p="units"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm-9 10c0-5 4-8 9-8s9 3 9 8z"/></svg>ユニット</button>
  <button data-p="shop"><svg viewBox="0 0 24 24"><path d="M6 7V6a6 6 0 0 1 12 0v1h3l-1 15H4L3 7zm2 0h8V6a4 4 0 0 0-8 0z"/></svg>ショップ</button>
 </div>
 <div id="cmdw"></div>
 <div id="bpan"><div id="pgrid"></div><div class="hint">タップ:攻撃　→スワイプ/長押し:アビリティ　←スワイプ:防御</div></div>
 <div id="dpan"><div id="dparty"></div><div id="dctl"><button id="dGyro" class="sub">ジャイロ<small>OFF/ON</small></button><button id="dMap" class="sub">MAP</button><button id="dExit" class="sub">メニュー</button></div></div>
 <div id="tpan"></div>
 <div id="sheet"></div>
 <div id="fmenu" class="page"></div>
 <div id="talk"><img class="pt" alt=""><div class="box"><img class="ic" alt=""><div class="who"></div><div class="tx"></div></div><button class="skip">SKIP</button></div>
 <div id="sum"><canvas id="scv"></canvas><button id="sSkip">SKIP</button></div>
 <div id="modal"></div>
 <div id="toast"></div>
</div>
<script src="js/game.js"></script>
</body>
</html>
